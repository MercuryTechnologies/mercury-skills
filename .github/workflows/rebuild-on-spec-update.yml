name: Rebuild Skills on OpenAPI Update

on:
  repository_dispatch:
    types: [openapi-spec-updated]
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      # See: https://github.com/enterprises/mercury/settings/apps/mercury-openapi-sync
      - uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        id: app-token
        with:
          app-id: "3051655" # Mercury OpenAPI Sync
          private-key: ${{ secrets.MERCURY_OPENAPI_SYNC_PRIVATE_KEY }}
          owner: MercuryTechnologies
          repositories: mercury-openapi,mercury-skills

      - name: Checkout mercury-skills
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout mercury-openapi specs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MercuryTechnologies/mercury-openapi
          path: _openapi
          token: ${{ steps.app-token.outputs.token }}

      - name: Copy latest spec
        run: cp _openapi/specs/openapi-mercuryapi.yaml openapi/mercuryapi.yaml

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and build
        run: npm run build

      - name: Create PR with updated skills
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: regenerate skills from updated OpenAPI spec"
          title: "chore: regenerate skills from OpenAPI spec update"
          body: |
            Auto-generated from mercury-openapi spec update.
            Source commit: ${{ github.event.client_payload.sha || 'manual trigger' }}

            Review the `_generated.md` and `SKILL.md` diffs to verify endpoint changes.
          branch: auto/openapi-update
          labels: automated
