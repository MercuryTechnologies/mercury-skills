components:
  schemas:
    Account:
      properties:
        accountNumber:
          type: string
        availableBalance:
          multipleOf: 1.0e-2
          type: number
        canReceiveTransactions:
          nullable: true
          type: boolean
        createdAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
        currentBalance:
          multipleOf: 1.0e-2
          type: number
        dashboardLink:
          type: string
        id:
          allOf:
          - $ref: '#/components/schemas/TransactionPartyId'
        kind:
          type: string
        legalBusinessName:
          type: string
        name:
          type: string
        nickname:
          nullable: true
          type: string
        routingNumber:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/AccountStatus'
        type:
          allOf:
          - $ref: '#/components/schemas/AccountType'
      required:
      - id
      - accountNumber
      - routingNumber
      - name
      - status
      - type
      - createdAt
      - availableBalance
      - currentBalance
      - kind
      - legalBusinessName
      - dashboardLink
      type: object
    AccountCard:
      properties:
        cardId:
          type: string
        createdAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
        lastFourDigits:
          type: string
        nameOnCard:
          type: string
        network:
          allOf:
          - $ref: '#/components/schemas/CardNetwork'
        physicalCardStatus:
          allOf:
          - $ref: '#/components/schemas/PhysicalCardStatus'
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/CardStatus'
      required:
      - cardId
      - nameOnCard
      - lastFourDigits
      - network
      - status
      - createdAt
      type: object
    AccountCardsResponse:
      properties:
        cards:
          items:
            $ref: '#/components/schemas/AccountCard'
          type: array
      required:
      - cards
      type: object
    AccountStatement:
      properties:
        companyLegalAddress:
          allOf:
          - $ref: '#/components/schemas/Address'
        companyLegalName:
          type: string
        details:
          allOf:
          - $ref: '#/components/schemas/AccountStatementPayload'
        downloadUrl:
          type: string
        ein:
          nullable: true
          type: string
        endDate:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
        endingBalance:
          allOf:
          - $ref: '#/components/schemas/Dollar'
        id:
          allOf:
          - $ref: '#/components/schemas/AccountStatementId'
        startDate:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
        transactions:
          items:
            $ref: '#/components/schemas/AccountStatementTransaction'
          type: array
      required:
      - startDate
      - endDate
      - companyLegalName
      - companyLegalAddress
      - endingBalance
      - details
      - downloadUrl
      - id
      - transactions
      type: object
    AccountStatementId:
      description: ID for the account statement
      format: uuid
      type: string
    AccountStatementPayload:
      description: Account statement payload with type discriminator
      properties:
        accountDetails:
          description: Account-specific details based on accountType
          oneOf:
          - $ref: '#/components/schemas/DepositoryAccountStatementPayload'
          - $ref: '#/components/schemas/CreditAccountStatementPayload'
        accountType:
          enum:
          - Depository
          - Credit
          type: string
      required:
      - accountType
      - accountDetails
      type: object
    AccountStatementTransaction:
      properties:
        createdAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
        id:
          allOf:
          - $ref: '#/components/schemas/TransactionMetadataId'
        postedAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
          nullable: true
      required:
      - id
      - createdAt
      type: object
    AccountStatementsResponse:
      properties:
        statements:
          items:
            $ref: '#/components/schemas/AccountStatement'
          type: array
      required:
      - statements
      type: object
    AccountStatus:
      enum:
      - active
      - deleted
      - pending
      - archived
      type: string
    AccountType:
      enum:
      - mercury
      - external
      - recipient
      type: string
    AccountsResponse:
      properties:
        accounts:
          items:
            $ref: '#/components/schemas/Account'
          type: array
      required:
      - accounts
      type: object
    AddRecipientRequest:
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/AddressData'
          description: Deprecated. Use checkInfo instead.
        checkInfo:
          allOf:
          - $ref: '#/components/schemas/CheckInfoRaw'
          description: Information needed to send a physical check.
        contactEmail:
          allOf:
          - $ref: '#/components/schemas/Email'
          description: Contact email address of the recipient
        domesticWireRoutingInfo:
          allOf:
          - $ref: '#/components/schemas/DomesticWireRoutingInfoRaw'
          description: Information needed to send a domestic wire.
        electronicRoutingInfo:
          allOf:
          - $ref: '#/components/schemas/ElectronicRoutingInfoRaw'
          description: Information needed to send an ACH.
        emails:
          items:
            $ref: '#/components/schemas/Email'
          type: array
        name:
          type: string
        nickname:
          type: string
      required:
      - name
      - emails
      type: object
    Address:
      properties:
        address1:
          type: string
        address2:
          nullable: true
          type: string
        city:
          type: string
        country:
          allOf:
          - $ref: '#/components/schemas/ISO3166Alpha2'
        name:
          type: string
        postalCode:
          type: string
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
      required:
      - name
      - address1
      - city
      - region
      - postalCode
      - country
      type: object
    AddressData:
      properties:
        address1:
          type: string
        address2:
          nullable: true
          type: string
        city:
          type: string
        postalCode:
          type: string
        state:
          allOf:
          - $ref: '#/components/schemas/USState'
          nullable: true
      required:
      - address1
      - city
      - postalCode
      type: object
    AddressWithoutName:
      properties:
        address1:
          type: string
        address2:
          nullable: true
          type: string
        city:
          type: string
        country:
          allOf:
          - $ref: '#/components/schemas/ISO3166Alpha2'
        postalCode:
          type: string
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
      required:
      - address1
      - city
      - region
      - postalCode
      - country
      type: object
    ApiEventId:
      description: ID for the API event
      format: uuid
      type: string
    ApiEventOperationType:
      enum:
      - create
      - update
      - delete
      type: string
    ApiEventResourceType:
      enum:
      - transaction
      - checkingAccount
      - savingsAccount
      - treasuryAccount
      - investmentAccount
      - creditAccount
      type: string
    ApiEventResponse:
      description: |2-
         Represents a single event in the Mercury API event stream.
         | Events track changes to resources over time, providing an audit trail
         | of all modifications with before/after values and metadata about what changed.
      properties:
        changedPaths:
          description: ' List of JSON paths that were modified in this event'
          items:
            type: string
          type: array
        id:
          allOf:
          - $ref: '#/components/schemas/ApiEventId'
          description: ' Unique identifier for this event'
        mergePatch:
          description: ' JSON object containing the fields that were changed and their
            new values'
          type: object
        occurredAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
          description: ' Timestamp when the event occurred'
        operationType:
          allOf:
          - $ref: '#/components/schemas/ApiEventOperationType'
          description: ' The type of operation performed (e.g., create, update, delete)'
        previousValues:
          description: ' JSON object containing the fields that were changed and their
            previous values before the update'
          nullable: true
          type: object
        resourceId:
          allOf:
          - $ref: '#/components/schemas/UUID'
          description: ' The ID of the resource that was affected'
        resourceType:
          allOf:
          - $ref: '#/components/schemas/ApiEventResourceType'
          description: ' The type of resource that was affected (e.g., transaction,
            account)'
        resourceVersion:
          allOf:
          - $ref: '#/components/schemas/ResourceVersion'
          description: ' Version number of the resource after this change'
      required:
      - id
      - resourceType
      - resourceId
      - operationType
      - resourceVersion
      - occurredAt
      - changedPaths
      - mergePatch
      type: object
    ApiEventsPaginatedResponse:
      description: |2-
         Paginated response containing a list of API events.
         | Use the page cursor information to fetch additional pages of events.
      properties:
        events:
          description: ' List of events in the current page'
          items:
            $ref: '#/components/schemas/ApiEventResponse'
          type: array
        page:
          allOf:
          - $ref: '#/components/schemas/Page'
          description: ' Pagination information including cursors for navigating to
            next/previous pages'
      required:
      - events
      - page
      type: object
    ApiOrganizationKind:
      enum:
      - personal
      - business
      type: string
    ApiSendEmailOption:
      enum:
      - DontSend
      - SendNow
      type: string
    ApiUpdateTransactionRequest:
      description: ' Request body for updating transaction metadata via the public
        API'
      properties:
        categoryId:
          allOf:
          - $ref: '#/components/schemas/CategoryId'
          description: ' How to update the transaction''s category. Omit field to
            keep current, send null to clear, send ID to set.'
        note:
          allOf:
          - $ref: '#/components/schemas/NoteUpdate'
          description: ' How to update the transaction''s note. Omit field to keep
            current, send null/empty to clear, send text to set.'
      required:
      - note
      - categoryId
      type: object
    ApiUserRole:
      enum:
      - administrator
      - bookkeeper
      - customUser
      - cardOnlyUser
      - employee
      type: string
    ApiV1ArAttachmentResponseData:
      description: |2-
         The object representing a file attachment for an invoice.
         The file is not a part of this object itself but information
         for where to download it will be in this object.
      properties:
        fileName:
          description: ' The filename for the file'
          type: string
        id:
          allOf:
          - $ref: '#/components/schemas/AttachmentId'
          description: ' The id of the attachment object'
        url:
          description: ' The signed download URL for the file itself'
          type: string
      required:
      - id
      - url
      - fileName
      type: object
    ApiV1ArAttachmentsResponseData:
      description: ' The response type for fetching attachments related to an AR Invoice.'
      properties:
        attachments:
          description: ' The list of attachments'
          items:
            $ref: '#/components/schemas/ApiV1ArAttachmentResponseData'
          type: array
      required:
      - attachments
      type: object
    ApiV1ArCustomerAddress:
      description: ' Customer address information for Accounts Receivable API'
      properties:
        address1:
          description: ' Primary street address line'
          type: string
        address2:
          description: ' Secondary street address line (optional)'
          nullable: true
          type: string
        city:
          description: ' City name'
          type: string
        country:
          allOf:
          - $ref: '#/components/schemas/ISO3166Alpha2'
          description: ' Country code in ISO 3166-1 alpha-2 format'
        postalCode:
          description: ' Postal or ZIP code'
          type: string
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
          description: ' State, province, or region'
      required:
      - address1
      - city
      - region
      - postalCode
      - country
      type: object
    ApiV1ArCustomerAddressInput:
      description: ' Address input for creating or updating customers'
      properties:
        address1:
          description: ' The first line of the address.'
          type: string
        address2:
          description: ' The second line of the address, if applicable.'
          nullable: true
          type: string
        city:
          description: ' The city name.'
          type: string
        country:
          allOf:
          - $ref: '#/components/schemas/ISO3166Alpha2'
          description: ' Two-letter country code (ISO 3166-1 alpha-2).'
        name:
          description: ' The mailing name of the address.'
          type: string
        postalCode:
          description: ' Postal or ZIP code.'
          type: string
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
          description: ' Either a two-letter US state code i.e. "CA" for California
            or a free-form identification of a particular region worldwide.'
      required:
      - name
      - address1
      - city
      - region
      - postalCode
      - country
      type: object
    ApiV1ArCustomerCreateRequest:
      description: ' Request data to create a customer using the public api'
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/ApiV1ArCustomerAddressInput'
          description: ' The address for the customer'
          nullable: true
        email:
          allOf:
          - $ref: '#/components/schemas/Email'
          description: ' The email address for the customer'
        name:
          description: ' The name of the customer'
          type: string
      required:
      - name
      - email
      type: object
    ApiV1ArCustomerResponseData:
      description: ' Response data for Accounts Receivable customer API endpoints'
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/ApiV1ArCustomerAddress'
          description: ' Address of customer'
          nullable: true
        deletedAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
          description: ' The time the customer was deleted, if it was deleted'
          nullable: true
        email:
          allOf:
          - $ref: '#/components/schemas/Email'
          description: ' Email of customer'
        id:
          allOf:
          - $ref: '#/components/schemas/CustomerId'
          description: ' ArCustomerId'
        name:
          description: ' Name of customer'
          type: string
      required:
      - id
      - email
      - name
      type: object
    ApiV1ArCustomerUpdateRequest:
      description: ' Request data to update a customer using the public api'
      properties:
        address:
          allOf:
          - $ref: '#/components/schemas/ApiV1ArCustomerAddressInput'
          description: ' The address for the customer'
          nullable: true
        email:
          allOf:
          - $ref: '#/components/schemas/Email'
          description: ' The email address for the customer'
        name:
          description: ' The name of the customer'
          type: string
        resendOpenInvoices:
          description: |2-
             Open invoices for the customer will be resent with updated data
             when this is true
          type: boolean
      required:
      - name
      - email
      - resendOpenInvoices
      type: object
    ApiV1ArCustomersResponseData:
      description: ' Response data for Accounts Receivable customers API endpoint'
      properties:
        customers:
          description: ' The list of customers'
          items:
            $ref: '#/components/schemas/ApiV1ArCustomerResponseData'
          type: array
      required:
      - customers
      type: object
    ApiV1ArInvoiceCreateRequest:
      description: ' The request body to create an invoice.'
      properties:
        achDebitEnabled:
          description: ' Whether or not the invoice can be paid via ACH debit.'
          type: boolean
        ccEmails:
          description: ' Emails to be CCed on invoice notifications/reminders.'
          items:
            $ref: '#/components/schemas/Email'
          type: array
        creditCardEnabled:
          description: ' Whether or not the invoice can be paid via credit card. Requires
            Stripe to be setup for the Mercury account.'
          type: boolean
        customerId:
          allOf:
          - $ref: '#/components/schemas/CustomerId'
          description: ' Id of the customer the invoice was sent to.'
        destinationAccountId:
          allOf:
          - $ref: '#/components/schemas/TransactionPartyId'
          description: ' The id of the destination account where money will be paid
            to for this invoice.'
        dueDate:
          allOf:
          - $ref: '#/components/schemas/Day'
          description: ' The due date the invoice should be paid by. YYYY-MM-DD'
        internalNote:
          description: ' Internal note for the invoice, visible by users in the organization
            but not visible to payers.'
          nullable: true
          type: string
        invoiceDate:
          allOf:
          - $ref: '#/components/schemas/Day'
          description: ' The date of the invoice, set by the invoice creator and likely
            to be context specific to the type of transaction. For example, it could
            be a date a service was performed. YYYY-MM-DD'
        invoiceNumber:
          description: ' The payer facing invoice number/identifier.'
          nullable: true
          type: string
        lineItems:
          description: ' The line items for the invoice'
          items:
            $ref: '#/components/schemas/ApiV1ArLineItemData'
          type: array
        payerMemo:
          description: ' Memo for the payer of the invoice.'
          nullable: true
          type: string
        poNumber:
          description: ' Purchase order number for the invoice, if applicable.'
          nullable: true
          type: string
        sendEmailOption:
          allOf:
          - $ref: '#/components/schemas/ApiSendEmailOption'
          description: ' Rules for emailing the new invoice to payers. Can be "DontSend"
            to skip sending or "SendNow" to send immediately. If omitted, defaults
            to sending immediately.'
          nullable: true
        useRealAccountNumber:
          description: ' Whether or not the invoice payment instructions will show
            the real account and routing number for the destination account or use
            virtual account numbers instead. Virtual accounts are safer and are preferred
            in most cases.'
          type: boolean
      required:
      - dueDate
      - invoiceDate
      - customerId
      - ccEmails
      - destinationAccountId
      - creditCardEnabled
      - achDebitEnabled
      - useRealAccountNumber
      - lineItems
      type: object
    ApiV1ArInvoiceResponse:
      description: ' The response type for an invoice in the api.'
      properties:
        achDebitEnabled:
          description: ' Whether or not the invoice can be paid via ach debit.'
          type: boolean
        amount:
          allOf:
          - $ref: '#/components/schemas/NonNegativeDollar'
          description: ' The total amount of the invoice line items plus taxes.'
        canceledAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
          description: ' The time when the invoice was canceled.'
          nullable: true
        ccEmails:
          description: ' Emails to be CCed on invoice notifications/reminders.'
          items:
            $ref: '#/components/schemas/Email'
          type: array
        createdAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
          description: ' The timestamp when the invoice was created.'
        creditCardEnabled:
          description: |2-
             Whether or not the invoice can be paid via credit card. Requires stripe to be
             setup for the Mercury account.
          type: boolean
        customerId:
          allOf:
          - $ref: '#/components/schemas/CustomerId'
          description: ' Id of the customer the invoice was sent to.'
        destinationAccountId:
          allOf:
          - $ref: '#/components/schemas/TransactionPartyId'
          description: ' The id of the destintation account where money will be paid
            to for this invoice.'
        dueDate:
          allOf:
          - $ref: '#/components/schemas/Day'
          description: ' The due date the invoice should be paid by.'
        id:
          allOf:
          - $ref: '#/components/schemas/InvoiceId'
          description: ' The Id of the invoice.'
        internalNote:
          description: |2-
             Internal note for the invoice, visible by users in the
             mercury organization but not visible to payers.
          nullable: true
          type: string
        invoiceDate:
          allOf:
          - $ref: '#/components/schemas/Day'
          description: |2-
             The date of the invoice, set by the invoice creator
             and likely to be context specific to the type of transaction.
             i.e. it could be a date a service was performed, it does not need
             to be the date the invoice was created.
        invoiceNumber:
          description: ' The payer facing invoice number/identifier.'
          type: string
        lineItems:
          description: ' The line items for the invoice.'
          items:
            $ref: '#/components/schemas/ApiV1ArLineItemData'
          type: array
        payerMemo:
          description: ' Memo for the payer of the invoice.'
          nullable: true
          type: string
        poNumber:
          description: ' Purchase order number for the invoice if applicable.'
          nullable: true
          type: string
        slug:
          description: |2-
             Public slug for an invoice. Used to construct the pay page URL
             as well as the URL to retrieve the PDF of the invoice.
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentLinkStatus'
          description: ' The status of the invoice.'
        updatedAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
          description: ' The timestamp when the invoice was updated.'
        useRealAccountNumber:
          description: |2-
             Whether or not the invoice payment instructions will show the real
             account and routing number for the destination account or use
             virtual account numbers instead.
          type: boolean
      required:
      - id
      - dueDate
      - invoiceDate
      - invoiceNumber
      - customerId
      - ccEmails
      - slug
      - status
      - amount
      - destinationAccountId
      - creditCardEnabled
      - achDebitEnabled
      - useRealAccountNumber
      - createdAt
      - updatedAt
      - lineItems
      type: object
    ApiV1ArInvoiceUpdateRequest:
      description: ' The request body to update an invoice.'
      properties:
        achDebitEnabled:
          description: ' Whether or not the invoice can be paid via ACH debit.'
          type: boolean
        ccEmails:
          description: ' List of emails to be CCed on notifications/reminders.'
          items:
            $ref: '#/components/schemas/Email'
          type: array
        creditCardEnabled:
          description: ' Whether or not the invoice can be paid via credit card. Requires
            Stripe to be setup for the Mercury account.'
          type: boolean
        dueDate:
          allOf:
          - $ref: '#/components/schemas/Day'
          description: ' The date the invoice should be paid by. YYYY-MM-DD'
        internalNote:
          description: ' Internal note for the invoice, visible by users in the organization
            but not visible to payers.'
          nullable: true
          type: string
        invoiceDate:
          allOf:
          - $ref: '#/components/schemas/Day'
          description: ' The date of the invoice, set by the invoice creator. Does
            not have to be the day the invoice was created. It can be business specific
            i.e. service/sale date. YYYY-MM-DD'
        invoiceNumber:
          description: ' The invoice number.'
          type: string
        lineItems:
          description: ' The line items for the invoice'
          items:
            $ref: '#/components/schemas/ApiV1ArLineItemData'
          type: array
        payerMemo:
          description: ' Memo for the payer of the invoice.'
          nullable: true
          type: string
        poNumber:
          description: ' The purchase order number for the invoice if applicable.'
          nullable: true
          type: string
        useRealAccountNumber:
          description: ' Whether or not the invoice payment instructions will show
            the real account and routing number for the destination account or use
            virtual account numbers instead.'
          type: boolean
      required:
      - dueDate
      - invoiceDate
      - invoiceNumber
      - ccEmails
      - creditCardEnabled
      - achDebitEnabled
      - useRealAccountNumber
      - lineItems
      type: object
    ApiV1ArInvoicesData:
      description: ' Response data for Accounts Receivable invoices API Endpoint'
      properties:
        achDebitEnabled:
          description: ' Whether or not the invoice can be paid via ach debit.'
          type: boolean
        amount:
          allOf:
          - $ref: '#/components/schemas/NonNegativeDollar'
          description: ' The total amount of the invoice line items plus taxes'
        canceledAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
          description: ' The time when the invoice was canceled'
          nullable: true
        ccEmails:
          description: ' Emails to be CCed on invoice notifications/reminders.'
          items:
            $ref: '#/components/schemas/Email'
          type: array
        createdAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
          description: ' The timestamp when the invoice was created'
        creditCardEnabled:
          description: |2-
             Whether or not the invoice can be paid via credit card. Requires stripe to be
             setup for the Mercury account.
          type: boolean
        customerId:
          allOf:
          - $ref: '#/components/schemas/CustomerId'
          description: ' Id of the customer the invoice was sent to.'
        destinationAccountId:
          allOf:
          - $ref: '#/components/schemas/TransactionPartyId'
          description: ' The id of the destintation account where money will be paid
            to for this invoice'
        dueDate:
          allOf:
          - $ref: '#/components/schemas/Day'
          description: ' The due date the invoice should be paid by.'
        id:
          allOf:
          - $ref: '#/components/schemas/InvoiceId'
          description: ' The Id of the invoice.'
        internalNote:
          description: |2-
             Internal note for the invoice, visible by users in the
             mercury organization but not visible to payers.
          nullable: true
          type: string
        invoiceDate:
          allOf:
          - $ref: '#/components/schemas/Day'
          description: |2-
             The date of the invoice, set by the invoice creator
             and likely to be context specific to the type of transaction.
             i.e. it could be a date a service was performed, it does not need
             to be the date the invoice was created.
        invoiceNumber:
          description: ' The payer facing invoice number/identifier.'
          type: string
        payerMemo:
          description: ' Memo for the payer of the invoice.'
          nullable: true
          type: string
