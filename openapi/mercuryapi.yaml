    TealLineEntry:
      properties:
        amount:
          allOf:
          - $ref: '#/components/schemas/Dollar'
          description: ' The value of the line entry in decimal dollar cents.'
        datetime:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
          description: ' The datetime the Line Entry was created in UTC time.'
        debit_credit:
          description: ' Indicates if the amount is a credit or debit.'
          enum:
          - debit
          - credit
          type: string
        description:
          description: ' An arbitrary string on the object, useful for displaying
            to the user or for categorization.'
          nullable: true
          type: string
        editable:
          description: ' Indicates if the Line Entry can be manually added or removed
            from a Ledger, as dictated by the `editable` property on the Ledger.'
          type: boolean
        id:
          description: ' The unique ID of the object. Can be null in some cases for
            Instances using QuickBooks as their accounting package.'
          example: 7JRNsKwy2Lw66caxVU7WGC
          format: base58 (max length 22)
          type: string
