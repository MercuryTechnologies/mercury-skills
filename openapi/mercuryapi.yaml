          description: ' The ID of the associated Journal Entry. Can be null in some
            cases for Instances using QuickBooks as their accounting package.'
          example: 7JRNsKwy2Lw66caxVU7WGC
          format: base58 (max length 22)
          type: string
        ledger_id:
          description: ' The ID of the Line Entry''s Ledger. Can be null in some cases
            for Instances using QuickBooks as their accounting package.'
          example: 7JRNsKwy2Lw66caxVU7WGC
          format: base58 (max length 22)
          type: string
        ledger_name:
          description: ' The name of the Line Entry''s Ledger.'
          type: string
        opposing_ledger_ids:
          description: ' Expandable. IDs of the ledgers on the other side(s) of the
            line entry with opposite debit/credit.'
          items:
            description: The unique identifier for a Ledger
            example: 7JRNsKwy2Lw66caxVU7WGC
            format: base58 (max length 22)
            type: string
          nullable: true
          type: array
        related_line_entry_id:
          description: |2-
             If the Line Entry is identified as a transfer between accounts, the ID
             of the Line Entry in the opposing Ledger. Related guide:
             [Auto-categorization](https://docs.teal.dev/guides/platform/categorization/pipeline#transfers-between-accounts)
          example: 7JRNsKwy2Lw66caxVU7WGC
          format: base58 (max length 22)
          nullable: true
          type: string
        transaction_id:
          description: ' The ID of the associated Transaction, if one exists.'
          nullable: true
          type: string
