      - FraudulentChargeToMerchantRefund
      - PaymentRefundToFailedPayment
      - FailedPaymentToPaymentRefund
      - GiftCompensationToOriginalTransaction
      - FeePaymentToOriginalTransaction
      - OriginalTransactionToFeePayment
      - FeePaymentToFeeRebate
      - FeeRebateToFeePayment
      - FeePaymentToFeeReversal
      - FeeReversalToFeePayment
      - FeeRebateToFeeRebateReversal
      - FeeRebateReversalToFeeRebate
      - TreasurySplitLiquidation
      - ProvisionalCreditToOriginalCharge
      - OriginalChargeToProvisionalCredit
      - FeeAtmReimbursementToAtmTransaction
      - AtmTransactionToFeeAtmReimbursement
      - AtmTransactionToAtmReimbursementReversal
      - AtmReimbursementReversalToAtmTransaction
      - ReturnToOriginalTransaction
      - OriginalTransactionToReturn
      - ProvisionalCreditToReversal
      - ReversalToProvisionalCredit
      type: string
    TransactionStatus:
      enum:
      - pending
      - sent
      - cancelled
      - failed
      - reversed
      - blocked
      type: string
    TransactionsPaginatedResponse:
      properties:
        page:
          allOf:
          - $ref: '#/components/schemas/Page'
        transactions:
          items:
            $ref: '#/components/schemas/Transaction'
          type: array
      required:
      - transactions
      - page
      type: object
    TransactionsResponse:
      properties:
        total:
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          type: integer
        transactions:
          items:
            $ref: '#/components/schemas/Transaction'
          type: array
      required:
      - total
      - transactions
      type: object
    TreasuryAccount:
      properties:
        availableBalance:
          multipleOf: 1.0e-2
          type: number
        createdAt:
          allOf:
          - $ref: '#/components/schemas/UTCTime'
        currentBalance:
          multipleOf: 1.0e-2
          type: number
        id:
          allOf:
          - $ref: '#/components/schemas/TransactionPartyId'
        netReturns:
          description: ' Monthly net return breakdown with dividend and fee details'
          items:
            $ref: '#/components/schemas/TreasuryNetReturn'
          type: array
        status:
          allOf:
          - $ref: '#/components/schemas/AccountStatus'
      required:
      - id
      - status
      - createdAt
      - availableBalance
      - currentBalance
      - netReturns
      type: object
    TreasuryAccountsResponse:
      description: ' Response type for treasury accounts API endpoint'
      properties:
        accounts:
          description: ' List of treasury accounts in the response'
          items:
            $ref: '#/components/schemas/TreasuryAccount'
          type: array
      required:
      - accounts
      type: object
    TreasuryDividend:
      description: ' Dividend information for a specific treasury security'
      properties:
        amount:
          description: ' Dividend amount for this security'
          multipleOf: 1.0e-2
          type: number
        id:
          description: ' Security identifier (e.g., "617455696")'
          type: string
        securityName:
          description: ' Human-readable security name (e.g., "Morgan Stanley Ultra-Short
            Income Portfolio Class IR")'
          type: string
        type:
          allOf:
          - $ref: '#/components/schemas/SecurityIdType'
          description: ' Security identifier type'
      required:
      - id
      - type
      - securityName
      - amount
      type: object
    TreasuryLedgerPostedTransactionId:
      description: ID for this treasury transaction
      format: uuid
      type: string
    TreasuryNetReturn:
      description: ' Monthly net return breakdown for a treasury account'
      properties:
        dividends:
          description: ' List of dividends received by security'
          items:
            $ref: '#/components/schemas/TreasuryDividend'
          type: array
        month:
          allOf:
          - $ref: '#/components/schemas/Day'
          description: ' First day of the month for this net return'
        netAmount:
          description: ' Net return amount (dividends minus fees)'
          multipleOf: 1.0e-2
          type: number
        status:
          allOf:
          - $ref: '#/components/schemas/TreasuryNetReturnStatus'
          description: ' Status of this net return calculation'
        treasuryFee:
          description: ' Treasury fee charged for this period (positive value)'
          multipleOf: 1.0e-2
          type: number
      required:
      - month
      - netAmount
      - dividends
      - treasuryFee
      - status
      type: object
    TreasuryNetReturnStatus:
      enum:
      - processing
      - pending
      - charged
      - error
      type: string
    TreasuryTransactionDetails:
      properties:
        creditDescription:
          nullable: true
          type: string
        depositCounterpartyId:
          allOf:
          - $ref: '#/components/schemas/TransactionPartyId'
          nullable: true
        feeDescription:
          nullable: true
          type: string
        manualAmendmentDescription:
          nullable: true
          type: string
        security:
          nullable: true
          type: string
        sweepDirection:
          nullable: true
          type: string
        tradeAction:
          nullable: true
          type: string
        withdrawalCounterpartyId:
          allOf:
          - $ref: '#/components/schemas/TransactionPartyId'
          nullable: true
      type: object
    TreasuryTransactionType:
      enum:
      - depositCanceled
      - depositComplete
      - depositFailed
      - depositReturned
      - mercuryFeePosted
      - mercuryFeeFailed
      - mercuryFeeRefunded
      - mercuryFeeCanceled
      - withdrawalPosted
      - withdrawalFailed
      - withdrawalCanceled
      - withdrawalReturned
      - revertTxn
      - interestPosted
      - interestCanceled
      - manualAmendmentPosted
      - mercuryCreditPosted
      - mercuryCreditFailed
      - dividendPosted
      - dividendCanceled
      - dividendReinvestmentPosted
      - mutualFundTradeFailed
      - mutualFundTradePosted
      - sweepInPosted
      - sweepOutPosted
      - sweepReconcilePosted
      - valuationChangePosted
      type: string
    TreasuryTransactionsResponse:
      description: ' Response type for treasury transactions API endpoint'
      properties:
        cursor:
          allOf:
          - $ref: '#/components/schemas/SliceSequenceNumber'
          description: ' Pagination cursor for retrieving next batch of transactions'
          nullable: true
        transactions:
          description: ' List of treasury transactions in the response'
          items:
            $ref: '#/components/schemas/TreasuryTxn'
          type: array
      required:
      - transactions
      type: object
    TreasuryTxn:
      description: ' Treasury transaction data for external API consumption'
      properties:
        accountId:
          allOf:
          - $ref: '#/components/schemas/TransactionPartyId'
        additionalDetails:
          nullable: true
          type: string
        amount:
          multipleOf: 1.0e-2
          type: number
        balance:
          multipleOf: 1.0e-2
          type: number
        canonicalDay:
          allOf:
          - $ref: '#/components/schemas/Day'
        description:
          type: string
        details:
          allOf:
          - $ref: '#/components/schemas/TreasuryTransactionDetails'
          nullable: true
        id:
          allOf:
          - $ref: '#/components/schemas/TreasuryLedgerPostedTransactionId'
        security:
          nullable: true
          type: string
        type:
          allOf:
          - $ref: '#/components/schemas/TreasuryTransactionType'
      required:
      - type
      - id
      - accountId
      - description
      - amount
      - canonicalDay
      - balance
      type: object
    USState:
      enum:
      - AL
      - AK
      - AZ
      - AR
      - CA
      - CO
      - CT
      - DE
      - DC
      - FL
      - GA
      - HI
      - ID
      - IL
      - IN
      - IA
      - KS
      - KY
      - LA
      - ME
      - MD
      - MA
      - MI
      - MN
      - MS
      - MO
      - MT
      - NE
      - NV
      - NH
      - NJ
      - NM
      - NY
      - NC
      - ND
      - OH
      - OK
      - OR
      - PA
      - RI
      - SC
      - SD
      - TN
      - TX
      - UT
      - VT
      - VA
      - WA
      - WV
      - WI
      - WY
      type: string
    UTCTime:
      example: 2016-07-22T00:00:00Z
      format: yyyy-mm-ddThh:MM:ssZ
      type: string
    UUID:
      example: 00000000-0000-0000-0000-000000000000
      format: uuid
      type: string
    UpdateWebhookParams:
      description: |2-
         Request body for updating an existing webhook endpoint.
         All fields are optional - only provided fields will be updated.
      properties:
        eventTypes:
          description: ' Event types to subscribe to. Send null to subscribe to all
            event types. Send an array to subscribe to specific types. Omit to leave
            unchanged.'
          items:
            enum:
            - transaction.created
            - transaction.updated
            type: string
          nullable: true
          type: array
        filterPaths:
          description: ' Resource field paths to filter events by. When specified,
            webhook events will only be sent when one of these fields changes. Send
            null for no filtering. Send an array to filter by specific fields. Omit
            to leave unchanged.'
          items:
            enum:
            - transaction.amount
            - transaction.bankDescription
            - transaction.categoryData
            - transaction.customCategory
            - transaction.customCategory.id
            - transaction.customCategory.name
            - transaction.mercuryCategory
            - transaction.estimatedDeliveryDate
            - transaction.externalMemo
            - transaction.failedAt
            - transaction.note
            - transaction.postedAt
            - transaction.reasonForFailure
            - transaction.status
            type: string
          nullable: true
          type: array
        status:
          allOf:
          - $ref: '#/components/schemas/WebhookUpdateStatus'
          description: ' Webhook status. Only ''active'' and ''paused'' values are
            allowed. Omit to leave unchanged.'
          nullable: true
        url:
          description: ' The URL to which webhook events will be delivered. Omit to
            leave unchanged.'
          nullable: true
          type: string
      type: object
    UserDetails:
      description: ' Details of a user within an organization.'
      properties:
        email:
          description: ' User''s email address'
          type: string
        firstName:
          description: ' User''s first name'
          type: string
        lastName:
          description: ' User''s last name'
          type: string
        organizationRole:
          allOf:
          - $ref: '#/components/schemas/ApiUserRole'
          description: ' User''s role within the organization'
        userId:
          allOf:
          - $ref: '#/components/schemas/UserId'
          description: ' Unique identifier for the user'
      required:
      - userId
      - firstName
      - lastName
      - email
      - organizationRole
      type: object
    UserId:
      description: ID for the user
      format: uuid
      type: string
    UsersPaginatedResponse:
      description: ' Paginated response containing a list of organization users.'
      properties:
        page:
          allOf:
          - $ref: '#/components/schemas/Page'
          description: ' Pagination information including cursors for navigating to
            next/previous pages'
        users:
          description: ' List of users in the current page'
          items:
            $ref: '#/components/schemas/UserDetails'
          type: array
      required:
      - users
      - page
      type: object
    VerifyWebhookParams:
      description: ' Request body for verifying a webhook endpoint'
      properties:
        eventType:
          allOf:
          - $ref: '#/components/schemas/WebhookEventType'
          description: ' Optional event type to test. If not specified, defaults to
            transaction.created.'
          nullable: true
      type: object
    WebhookEventType:
      enum:
      - transaction.created
      - transaction.updated
      type: string
    WebhookUpdateStatus:
      enum:
      - active
      - paused
      type: string
  securitySchemes:
    basicAuth:
      description: |
        Basic authentication for Mercury API.

        Use your API token as the username with an empty password.

        Example:
        Username: `secret-token:mercury_production_wma_24SCp4G81X3yHL4Wq8FgzuaP9ye3VKf2mgTDctXyRg5HY_yrucrem`
        Password: (empty)
      scheme: basic
      type: http
    bearerAuth:
      description: |
        Bearer token authentication for Mercury API.

        Use your API token in the Authorization header:
        `Authorization: Bearer TOKEN`

        Example:
        `Authorization: Bearer secret-token:mercury_production_wma_24SCp4G81X3yHL4Wq8FgzuaP9ye3VKf2mgTDctXyRg5HY_yrucrem`

        Your Mercury API token should include the 'secret-token:' prefix.
        Tokens can be generated from your Mercury dashboard settings.
      scheme: bearer
      type: http
info:
  description: Streamline financial tasks with secure account management and transaction
    processing. Enables user registration, balance tracking, and payment handling.
  title: Mercury API
  version: 1.0.0
openapi: 3.0.0
paths:
  /account/{accountId}:
    get:
      operationId: getAccount
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          description: ID for the Mercury account
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '404':
          description: '`accountId` not found'
      summary: Get account by id
      tags:
      - Accounts
  /account/{accountId}/cards:
    get:
      description: Retrieve all debit and credit cards associated with a specific
        account.
      operationId: getAccountCards
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          description: ID for the Mercury account
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/AccountCardsResponse'
          description: ''
        '404':
          description: '`accountId` not found'
      summary: Get cards for account
      tags:
      - Accounts
  /account/{accountId}/request-send-money:
    post:
      description: Create a payment request that may require approval based on your
        organization's payment policies.
      operationId: requestSendMoney
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          description: ID for the Mercury account
          format: uuid
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/SendMoneyAPIRequest'
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SendMoneyApprovalRequestResponse'
          description: ''
        '400':
          description: Invalid `body`
        '404':
          description: '`accountId` not found'
      summary: Request to send money
      tags:
      - Accounts
  /account/{accountId}/statements:
    get:
      description: Retrieve monthly statements for a specific account. Supports date
        range filtering.
      operationId: getAccountStatements
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          description: ID for the Mercury account
          format: uuid
          type: string
      - in: query
        name: start
        required: false
        schema:
          type: string
      - in: query
        name: end
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/AccountStatementsResponse'
          description: ''
        '400':
          description: Invalid `end` or `start`
        '404':
          description: '`accountId` not found'
      summary: Get account statements
      tags:
      - Accounts
  /account/{accountId}/transaction/{transactionId}:
    get:
      operationId: getTransaction
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          description: ID for the Mercury account
          format: uuid
          type: string
      - in: path
        name: transactionId
        required: true
        schema:
          description: ID for this transaction
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
        '404':
          description: '`accountId` or `transactionId` not found'
      summary: Get transaction by id
      tags:
      - Accounts
  /account/{accountId}/transactions:
    get:
      description: Retrieve a paginated list of transactions for a specific account.
        Supports filtering by date range, status, and search terms.
      operationId: listAccountTransactions
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          description: ID for the Mercury account
          format: uuid
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 500
          description: 'Maximum number of results to return. Allowed range: 1 to 500.
            Defaults to 500'
          format: int64
          maximum: 500
          minimum: 1
          type: integer
      - in: query
        name: start
        required: false
        schema:
          description: 'Earliest date to filter transactions. If not provided, defaults
            to 30 days before the current date. Format: YYYY-MM-DD or ISO 8601 string'
          type: string
      - in: query
        name: end
        required: false
        schema:
          description: 'Latest date to filter transactions. If not provided, defaults
            to the current date. Format: YYYY-MM-DD or ISO 8601 string'
          type: string
      - in: query
        name: search
        required: false
        schema:
          description: Search term to filter transactions by description or counterparty
            name
          type: string
      - in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - sent
          - cancelled
          - failed
          - reversed
          - blocked
          type: string
      - in: query
        name: offset
        required: false
        schema:
          description: Number of results to skip for pagination
          format: int64
          minimum: 0
          type: integer
      - in: query
        name: order
        required: false
        schema:
          default: desc
          description: Sort order. Can be 'asc' or 'desc'. Defaults to 'desc'
          enum:
          - asc
          - desc
          type: string
      - in: query
        name: requestId
        required: false
        schema:
          description: Id returned from /account/:id/request-send-money
          format: uuid
          type: string
      - in: query
        name: mercuryCategory
        required: false
        schema:
          description: Name of mercuryCategory you want to filter on. Merchant Type
            in the UI.
          type: string
      - in: query
        name: categoryId
        required: false
        schema:
          description: UUID of a custom category. Can be returned from /categories
            endpoint.
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/TransactionsResponse'
          description: ''
        '400':
          description: Invalid `categoryId` or `mercuryCategory` or `requestId` or
            `order` or `offset` or `status` or `search` or `end` or `start` or `limit`
        '404':
          description: '`accountId` not found'
      summary: List account transactions
      tags:
      - Accounts
    post:
      description: Send money from this account. Creates a transaction that will be
        processed immediately or may require approval.
      operationId: createTransaction
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          description: ID for the Mercury account
          format: uuid
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/PostTransactionAPIRequest'
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
        '400':
          description: Invalid `body`
        '404':
          description: '`accountId` not found'
      summary: Create a transaction
      tags:
      - Accounts
  /accounts:
    get:
      operationId: getAccounts
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/AccountsResponse'
          description: ''
      summary: Get all accounts
      tags:
      - Accounts
  /ar/attachments/{attachmentId}:
    get:
      description: Retrieve attachment details including download URL
      operationId: getAttachment
      parameters:
      - in: path
        name: attachmentId
        required: true
        schema:
          description: ID for the attachment
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiV1ArAttachmentResponseData'
          description: ''
        '404':
          description: '`attachmentId` not found'
      summary: Get an attachment
      tags:
      - Invoices
  /ar/customers:
    get:
      description: Retrieve a list of all customers for the organization
      operationId: listCustomers
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiV1ArCustomersResponseData'
          description: ''
      summary: List all customers
      tags:
      - Customers
    post:
      description: Create a new customer for the organization
      operationId: createCustomer
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ApiV1ArCustomerCreateRequest'
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiV1ArCustomerResponseData'
          description: ''
        '400':
          description: Invalid `body`
      summary: Create a customer
      tags:
      - Customers
  /ar/customers/{customerId}:
    delete:
      description: Delete a customer. This action cannot be undone.
      operationId: deleteCustomer
      parameters:
      - in: path
        name: customerId
        required: true
        schema:
          description: ID for the customer
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json;charset=utf-8: {}
          description: ''
        '404':
          description: '`customerId` not found'
      summary: Delete a customer
      tags:
      - Customers
    get:
      description: Retrieve details of a specific customer by their ID
      operationId: getCustomer
      parameters:
      - in: path
        name: customerId
        required: true
        schema:
          description: ID for the customer
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiV1ArCustomerResponseData'
          description: ''
        '404':
          description: '`customerId` not found'
      summary: Get a customer
      tags:
      - Customers
    post:
      description: Update an existing customer
      operationId: updateCustomer
      parameters:
      - in: path
        name: customerId
        required: true
        schema:
          description: ID for the customer
          format: uuid
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ApiV1ArCustomerUpdateRequest'
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiV1ArCustomerResponseData'
          description: ''
        '400':
          description: Invalid `body`
        '404':
          description: '`customerId` not found'
      summary: Update a customer
      tags:
      - Customers
  /ar/invoices:
    get:
      description: Retrieve a list of all invoices for the organization
      operationId: listInvoices
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiV1ArInvoicesResponseData'
          description: ''
      summary: List all invoices
      tags:
      - Invoices
    post:
      description: Create a new invoice for the organization
      operationId: createInvoice
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ApiV1ArInvoiceCreateRequest'
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiV1ArInvoiceResponse'
          description: ''
        '400':
          description: Invalid `body`
      summary: Create an invoice
      tags:
      - Invoices
  /ar/invoices/{invoiceId}:
    get:
      description: Retrieve details of an invoice by its ID
      operationId: getInvoice
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          description: ID for the invoice
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiV1ArInvoiceResponse'
          description: ''
        '404':
          description: '`invoiceId` not found'
      summary: Get an invoice
      tags:
      - Invoices
    post:
      description: Update an existing invoice
      operationId: updateInvoice
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          description: ID for the invoice
          format: uuid
          type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
